[mypy]
python_version = 3.12
strict = true
explicit_package_bases = true
mypy_path = $MYPY_CONFIG_FILE_DIR,$MYPY_CONFIG_FILE_DIR/../contract,$MYPY_CONFIG_FILE_DIR/../../packages/python
follow_imports = silent

# These reviewed SDK distributions expose dynamic, untyped clients and models.
# Fixture-owned code stays checked; runtime assertions verify SDK responses.
[mypy-boto3.*,botocore.*,s3transfer.*]
ignore_missing_imports = true

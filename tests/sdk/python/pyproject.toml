[project]
name = "mikrio-sdk-fixtures"
version = "0.1.0"
description = "Python SDK interoperability fixtures for mikrio"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["boto3==1.43.126", "botocore==1.43.126"]

[tool.uv]
required-version = "==0.13.7"
package = false
exclude-newer = "3 days"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

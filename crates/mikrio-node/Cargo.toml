[package]
name = "mikrio-node"
version.workspace = true
description = "Native Node.js binding for mikrio"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[[example]]
name = "node_diagnostics_probe"
path = "examples/diagnostics_probe.rs"
crate-type = ["cdylib"]

[[example]]
name = "node_stream_probe"
path = "examples/stream_probe.rs"
crate-type = ["cdylib"]

[dependencies]
mikrio = { version = "=0.1.0", path = "../mikrio" }
mikrio-embed = { version = "=0.1.0", path = "../mikrio-embed" }
napi.workspace = true
napi-derive.workspace = true
tokio.workspace = true

[dev-dependencies]
bytes.workspace = true
mikrio-core = { version = "=0.1.0", path = "../mikrio-core" }

[build-dependencies]
mikrio-build = { version = "=0.1.0", path = "../mikrio-build" }
napi-build.workspace = true

[lints]
workspace = true

# Maintained manifest for mikrio; Cargo.toml.orig preserves the upstream source.
[package]
edition = "2024"
rust-version = "1.96.0"
name = "mikrio-s3s-multipart"
version = "0.17.0-mikrio.1"
exclude = ["Cargo.toml.orig"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "mikrio-maintained distribution: Async streaming parser for multipart/form-data"
readme = "README.md"
keywords = [
    "multipart",
    "form-data",
    "parser",
    "streaming",
]
categories = [
    "web-programming",
    "asynchronous",
]
license = "Apache-2.0"
repository = "https://github.com/meltyshev/mikrio"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[lib]
name = "s3s_multipart"
path = "src/lib.rs"

[[test]]
name = "protocol"
path = "tests/protocol/main.rs"

[[bench]]
name = "parse_throughput"
path = "benches/parse_throughput.rs"
harness = false

[[bench]]
name = "take_data_stream"
path = "benches/take_data_stream.rs"
harness = false

[[bench]]
name = "vs_multer"
path = "benches/vs_multer.rs"
harness = false

[dependencies.arrayvec]
version = "0.7.8"

[dependencies.bytes]
version = "1.12.1"

[dependencies.futures-core]
version = "0.3.32"

[dependencies.httparse]
version = "1.10.1"

[dependencies.memchr]
version = "2.8.3"

[dependencies.thiserror]
version = "2.0.18"

[dev-dependencies.criterion]
version = "0.8"

[dev-dependencies.futures]
version = "0.3.32"
features = ["executor"]
default-features = false

[dev-dependencies.futures-util]
version = "0.3.32"

[dev-dependencies.mimalloc]
version = "0.1"

[dev-dependencies.multer]
version = "3.1.0"

[dev-dependencies.rand]
version = "0.10"

[lints.clippy]
dbg_macro = "warn"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
self_named_module_files = "deny"

[lints.clippy.all]
level = "deny"
priority = -1

[lints.clippy.cargo]
level = "deny"
priority = -1

[lints.clippy.pedantic]
level = "deny"
priority = -1

[lints.rust]
unsafe_code = "forbid"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(fuzzing)"]

[package.metadata.mikrio]
upstream-name = "s3s-multipart"
upstream-version = "0.17.0"

[workspace]
resolver = "3"

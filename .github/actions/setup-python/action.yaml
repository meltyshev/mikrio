name: Set up Python and uv
description: Install the selected interpreter with the pinned uv version

inputs:
  python-version:
    description: Python interpreter version
    default: 3.14.10

runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: 0.13.7
        python-version: ${{ inputs.python-version }}
        enable-cache: false

    - name: Install Python
      shell: bash
      run: uv python install "$UV_PYTHON"

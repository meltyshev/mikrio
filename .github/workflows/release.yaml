name: Release

on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Use crates.io and npm secrets to create new registry packages
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Prepare release
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.identity.outputs.version }}
      bootstrap: ${{ steps.identity.outputs.bootstrap }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release version and source
        id: identity
        env:
          RELEASE_BOOTSTRAP: ${{ inputs.bootstrap }}
        run: python3 -m tools.release check

  checks:
    name: Run checks
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yaml
    with:
      release: true

  attest:
    name: Attest release
    needs: checks
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.checks.outputs.artifact-id }}
          path: release
          merge-multiple: true
          digest-mismatch: error

      - name: Attest release distributions
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS

  tag:
    name: Create release tag
    needs: [checks, attest]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.checks.outputs.artifact-id }}
          path: release
          merge-multiple: true
          digest-mismatch: error

      - name: Create tag for the tested source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m tools.publish_github tag release

  crates:
    name: Publish to crates.io
    needs: [prepare, checks, tag]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: crates-io
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.checks.outputs.artifact-id }}
          path: release
          merge-multiple: true
          digest-mismatch: error

      - name: Verify release before authentication
        run: python3 -m tools.release verify release

      - name: Verify bootstrap credentials
        if: needs.prepare.outputs.bootstrap == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "::error::Set CARGO_REGISTRY_TOKEN in the crates-io environment for bootstrap publishing."
            exit 1
          fi

      - name: Authenticate with crates.io
        if: needs.prepare.outputs.bootstrap != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish crates to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ needs.prepare.outputs.bootstrap == 'true' && secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: python3 -m tools.publish crates release

  npm:
    name: Publish to npm
    needs: [prepare, checks, tag]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: npm
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          package-manager-cache: false
          registry-url: ${{ needs.prepare.outputs.bootstrap == 'true' && 'https://registry.npmjs.org/' || '' }}

      - name: Download release distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.checks.outputs.artifact-id }}
          path: release
          merge-multiple: true
          digest-mismatch: error

      - name: Verify bootstrap credentials
        if: needs.prepare.outputs.bootstrap == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "::error::Set NPM_TOKEN in the npm environment for bootstrap publishing."
            exit 1
          fi

      - name: Publish packages to npm
        env:
          NODE_AUTH_TOKEN: ${{ needs.prepare.outputs.bootstrap == 'true' && secrets.NPM_TOKEN || '' }}
          NPM_CONFIG_PROVENANCE: "true"
        run: python3 -m tools.publish npm release

  pypi:
    name: Publish to PyPI
    needs: [checks, tag]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: pypi
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.checks.outputs.artifact-id }}
          path: release
          merge-multiple: true
          digest-mismatch: error

      - name: Verify and stage PyPI distributions
        id: staging
        run: python3 -m tools.publish prepare-pypi release --output pypi-upload

      - name: Publish distributions to PyPI
        if: steps.staging.outputs.pending == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: pypi-upload/
          attestations: true
          print-hash: true

  registry-checks:
    name: Verify published packages (${{ matrix.runner }})
    needs: [prepare, checks, crates, npm, pypi]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          package-manager-cache: false

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python

      - name: Download release distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.checks.outputs.artifact-id }}
          path: release
          merge-multiple: true
          digest-mismatch: error

      - name: Verify registry checksums
        run: python3 -m tools.publish verify release

      - name: Set up Rust
        run: rustup show

      - name: Test crates.io packages
        run: python3 -m tools.test_rust release --registry

      - name: Test PyPI package
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          uv venv --python "$UV_PYTHON" "$RUNNER_TEMP/mikrio-registry-python"
          registry_python="$RUNNER_TEMP/mikrio-registry-python/bin/python"
          uv pip install --python "$registry_python" --no-deps --only-binary :all: \
            --index-url https://pypi.org/simple "mikrio==$RELEASE_VERSION"
          cd "$RUNNER_TEMP"
          "$registry_python" - <<'PY'
          import importlib.metadata
          import os
          import tempfile

          from mikrio import Store

          assert importlib.metadata.version("mikrio") == os.environ["RELEASE_VERSION"]

          with tempfile.TemporaryDirectory() as directory:
              with Store.open(directory=directory) as store:
                  store.create_bucket(bucket="release-check")
                  store.put_object(bucket="release-check", key="object", body=b"verified")
          PY

      - name: Test npm packages
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir "$RUNNER_TEMP/mikrio-registry-node"
          cd "$RUNNER_TEMP/mikrio-registry-node"
          echo '{"private":true}' > package.json
          npm install --ignore-scripts --no-audit --no-fund \
            --registry https://registry.npmjs.org/ "@mikrio/node@$RELEASE_VERSION"
          node --input-type=module - <<'JS'
          import { Store } from "@mikrio/node";

          const store = await Store.open({ directory: "./store" });

          try {
            await store.createBucket({ bucket: "release-check" });

            await store.putObject({
              bucket: "release-check",
              key: "object",
              body: Buffer.from("verified"),
            });
          } finally {
            await store.close();
          }
          JS

  github:
    name: Publish to GitHub Releases
    needs: [checks, registry-checks]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.checks.outputs.artifact-id }}
          path: release
          merge-multiple: true
          digest-mismatch: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m tools.publish_github publish release

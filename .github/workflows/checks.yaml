name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Build and validate the complete release bundle
        type: boolean
        default: false
  workflow_call:
    inputs:
      release:
        description: Build and validate the complete release bundle
        type: boolean
        default: false
    outputs:
      artifact-id:
        description: Immutable artifact containing the validated release bundle
        value: ${{ jobs.assemble.outputs.artifact-id }}
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.release || false }}
  cancel-in-progress: ${{ github.workflow == 'Checks' }}

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  GOPROXY: https://proxy.golang.org
  GOTOOLCHAIN: local
  # The shared npm wrapper must have identical bytes on every builder.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"

jobs:
  dependencies:
    name: Audit dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check package versions
        run: python3 -m tools.version check

      - name: Set up Rust
        run: rustup show

      - name: Verify Rust dependency release ages
        run: python3 -m tools.dependencies

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python

      - name: Set up cargo-deny
        run: |
          archive="$RUNNER_TEMP/cargo-deny.tar.gz"
          curl --fail --location --output "$archive" \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"

      - name: Audit Rust dependencies with cargo-deny
        run: '"$RUNNER_TEMP/cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny" --locked check'

      - name: Audit Node.js dependencies with pnpm
        run: |
          pnpm audit
          pnpm --dir tests/sdk/node audit

      - name: Install Python dependencies
        run: uv sync --project packages/python --locked --group build --no-install-project --no-build

      - name: Audit Python dependencies with pip-audit
        run: |
          for project in packages/python tests/sdk/python; do
            uv export --project "$project" --locked --all-groups --no-emit-project \
              --output-file "$RUNNER_TEMP/python-requirements.txt" > /dev/null
            uv run --project packages/python --no-sync python -m pip_audit \
              --strict --require-hashes --disable-pip --progress-spinner off \
              --requirement "$RUNNER_TEMP/python-requirements.txt"
          done

  lint:
    name: Lint and verify source
    needs: dependencies
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        run: rustup show

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python

      - name: Install Node.js dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir tests/sdk/node install --frozen-lockfile

      - name: Install Python dependencies
        run: uv sync --project packages/python --locked --group build --no-install-project --no-build

      - name: Check Rust formatting with rustfmt
        run: cargo fmt -- --check

      - name: Lint Python with Ruff
        run: uv run --project packages/python --no-sync python -m ruff check tools schema packages/python tests

      - name: Check Python formatting with Ruff
        run: uv run --project packages/python --no-sync python -m ruff format --check tools schema packages/python tests

      - name: Check Python types with mypy
        run: uv run --project packages/python --no-sync python -m mypy --strict tools schema

      - name: Verify generated S3 code
        run: python3 -m tools.regenerate_s3s --check

      - name: Verify native license notices
        run: |
          for binding in python node cli ffi; do
            python3 -m tools.native_notices --target supported --binding "$binding" --check
          done

      - name: Check TypeScript types
        run: |
          node node_modules/typescript-compiler/bin/tsc -p packages/node/tsconfig.json
          node node_modules/typescript-compiler/bin/tsc -p packages/node/tsconfig.test.json --noEmit
          node node_modules/typescript-compiler/bin/tsc -p examples/node/attachments/tsconfig.json --noEmit
          node node_modules/typescript-compiler/bin/tsc -p tests/sdk/node/tsconfig.json

      - name: Lint TypeScript with ESLint
        run: |
          pnpm exec eslint \
            packages/node/src packages/node/tests \
            examples/node/attachments/src examples/node/attachments/tests \
            tests/sdk/node/src --max-warnings 0

      - name: Check formatting with Prettier
        run: |
          pnpm exec prettier --check \
            '.github/actions/**/*.yaml' '.github/workflows/*.yaml' \
            .github/renovate.json .prettierrc.json \
            package.json pnpm-workspace.yaml eslint.config.mjs \
            'packages/*/*.json' 'examples/**/package.json' 'examples/**/tsconfig.json' \
            'tests/sdk/node/*.json' tests/sdk/node/pnpm-workspace.yaml \
            packages/node/src packages/node/tests \
            examples/node/attachments/src examples/node/attachments/tests \
            tests/sdk/node/src

      - name: Check Markdown formatting with Prettier
        run: |
          pnpm exec prettier --check \
            '*.md' 'docs/**/*.md' 'crates/*/README.md' 'packages/*/README.md' \
            'examples/**/README.md' 'vendor/**/*.md'

      - name: Verify clean working tree
        run: |
          working_tree_status=$(git status --porcelain)
          test -z "$working_tree_status"

  rust:
    name: Lint and test Rust (${{ matrix.runner }}, ${{ matrix.suite }})
    needs: dependencies
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, macos-15]
        suite: [core, workspace]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      PYO3_BUILD_EXTENSION_MODULE: "1"
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        run: rustup show

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python

      - name: Select Python interpreter for builds and fixtures
        run: |
          python_interpreter=$(uv python find "$UV_PYTHON")
          echo "PYO3_PYTHON=$python_interpreter" >> "$GITHUB_ENV"
          echo "mikrio_test_python=$python_interpreter" >> "$GITHUB_ENV"

      - name: Lint and test the core
        if: matrix.suite == 'core'
        run: |
          cargo clippy -p mikrio-core --locked --all-targets -- -D warnings
          cargo test -p mikrio-core --locked -- --test-threads=1

      - name: Lint and test the remaining workspace
        if: matrix.suite == 'workspace'
        run: |
          cargo clippy --workspace --exclude mikrio-core --locked --all-targets -- -D warnings
          cargo clippy -p mikrio --no-default-features --locked --all-targets -- -D warnings
          cargo test --workspace --exclude mikrio-core --locked -- --test-threads=1
          cargo test -p mikrio --no-default-features --locked -- --test-threads=1

      - name: Build Rust documentation with rustdoc
        if: matrix.suite == 'workspace'
        run: |
          cargo doc -p mikrio --locked --no-deps
          cargo doc -p mikrio --no-default-features --locked --no-deps

      - name: Verify clean working tree
        run: |
          working_tree_status=$(git status --porcelain)
          test -z "$working_tree_status"

  sdk:
    name: Test tooling and SDKs (${{ matrix.runner }})
    needs: dependencies
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        run: rustup show

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/sdk/go/go.mod
          cache: false

      - name: Install Node.js dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir tests/sdk/node install --frozen-lockfile

      - name: Install Python dependencies
        run: |
          uv sync --project packages/python --locked --group build --no-install-project --no-build
          uv sync --project tests/sdk/python --locked --no-install-project --no-build
          echo "PYO3_PYTHON=$(uv python find "$UV_PYTHON")" >> "$GITHUB_ENV"

      - name: Verify database schema
        run: python3 schema/verify.py

      - name: Test Python tooling
        run: python3 -m unittest discover -s tools/tests

      - name: Compile Node.js SDK tests
        run: node node_modules/typescript-compiler/bin/tsc -p tests/sdk/node/tsconfig.json

      - name: Test Node.js SDK helpers
        run: node --test tests/sdk/node/dist/{reporter,request-defaults,transfer-sources}.test.mjs

      - name: Test Python SDK helpers
        run: |
          for suite in fixtures http_loss request_defaults transfer_sources; do
            uv run --project tests/sdk/python --no-sync python -m unittest discover \
              -s tests/sdk -p "test_$suite.py"
          done

      - name: Test SDK interoperability
        run: |
          for suite in integrity phases storage; do
            uv run --project tests/sdk/python --no-sync python -m tools.test_sdk "$suite"
          done
          uv run --project tests/sdk/python --no-sync python -m tools.test_sdk listener --go go

      - name: Verify clean working tree
        run: |
          working_tree_status=$(git status --porcelain)
          test -z "$working_tree_status"

  native:
    name: Build and test native distributions (${{ matrix.target }})
    needs: dependencies
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.release && '["macos-arm64","macos-x86_64","windows-x86_64","linux-arm64","linux-x86_64"]' || '["macos-arm64","windows-x86_64","linux-arm64"]') }}
    runs-on: >-
      ${{ fromJSON('{"macos-arm64":"macos-15","macos-x86_64":"macos-15-intel","windows-x86_64":"windows-2025","linux-arm64":"ubuntu-24.04-arm","linux-x86_64":"ubuntu-24.04"}')[matrix.target] }}
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check C and C++ consumers
        if: runner.os != 'Windows'
        run: |
          for source in tests/ffi/*.c; do
            cc -std=c11 -Wall -Wextra -Werror -pthread -fsyntax-only \
              -I crates/mikrio-ffi/include "$source"
          done
          c++ -std=c++20 -Wall -Wextra -Werror -pthread -fsyntax-only \
            -I crates/mikrio-ffi/include tests/ffi/layout.cpp

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc

      - name: Set up Rust
        run: rustup show

      - name: Set up Go
        if: runner.os != 'Windows'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/sdk/go/go.mod
          cache: false

      - name: Test C consumer harness
        run: uv run --no-project python -m unittest discover -s tests/ffi

      - name: Build and test native distributions
        if: runner.os != 'Linux'
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          pnpm install --frozen-lockfile
          uv sync --project packages/python --locked --group build --no-install-project --no-build
          consumers=()
          if [[ "$RUNNER_OS" != Windows ]]; then
            consumers+=(--go go --attachments)
          fi
          uv run --project packages/python --no-sync python -m tools.build_release native \
            --target "$RELEASE_TARGET" "${consumers[@]}"

      - name: Build and test native distributions with manylinux
        if: runner.os == 'Linux'
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          # manylinux 2026.11.07-1
          MANYLINUX_IMAGE: ${{ runner.arch == 'ARM64' && 'quay.io/pypa/manylinux_2_28_aarch64@sha256:cb37f0d66c8a75abb93cf6085cad1f1427cd7208f0c0fc48359bb1eea9924f21' || 'quay.io/pypa/manylinux_2_28_x86_64@sha256:9555ba6c479fa69a2aa80ad1dc57154a60d562b19df159361d9379a02beb1e36' }}
        run: |
          docker run --rm \
            --mount "type=bind,source=$PWD,target=/io" \
            --mount "type=bind,source=$(rustup show home),target=/opt/rustup,readonly" \
            --mount "type=bind,source=$(dirname "$(command -v cargo)"),target=/opt/rust/bin,readonly" \
            --mount "type=bind,source=$(dirname "$(dirname "$(command -v node)")"),target=/opt/node,readonly" \
            --mount "type=bind,source=$(command -v uv),target=/usr/local/bin/uv,readonly" \
            --mount "type=bind,source=$(go env GOROOT),target=/opt/go,readonly" \
            --workdir /io \
            --env RELEASE_TARGET \
            --env RUSTUP_HOME=/opt/rustup \
            --env CARGO_HOME=/tmp/cargo \
            --env CARGO_INCREMENTAL \
            --env CARGO_PROFILE_DEV_DEBUG \
            --env GOPROXY \
            --env GOTOOLCHAIN \
            --env UV_PYTHON \
            --env UV_CACHE_DIR=/tmp/uv \
            --env UV_PYTHON_INSTALL_DIR=/tmp/python \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/io \
            --env PATH=/opt/go/bin:/opt/node/bin:/opt/rust/bin:/opt/rh/gcc-toolset-14/root/usr/bin:/opt/python/cp314-cp314/bin:/usr/local/bin:/usr/bin:/bin \
            "$MANYLINUX_IMAGE" bash -euo pipefail -c '
              pnpm install --frozen-lockfile
              uv sync --project packages/python --locked --group build --no-install-project --no-build
              uv run --project packages/python --no-sync python -m tools.build_release native \
                --target "$RELEASE_TARGET" --go go --attachments
            '

      - name: Verify clean working tree
        run: |
          working_tree_status=$(git status --porcelain)
          test -z "$working_tree_status"

      - name: Upload native distributions
        if: inputs.release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  runtimes:
    name: Test runtime compatibility (${{ matrix.platform.target }}, Node.js ${{ matrix.runtime.node }}, Python ${{ matrix.runtime.python }})
    needs: native
    if: inputs.release
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: macos-arm64
            runner: macos-15
          - target: linux-arm64
            runner: ubuntu-24.04-arm
        runtime:
          - node: 22.23.4
            python: 3.13.18
          - node: 24.22.2
            python: 3.15.2
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Node.js for testing
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.runtime.node }}
          package-manager-cache: false

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.runtime.python }}

      - name: Download native distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-${{ matrix.platform.target }}
          path: dist
          digest-mismatch: error

      - name: Test installed distributions
        run: |
          release_version=$(python3 -m tools.version show)
          python_interpreter=$(uv python find "$UV_PYTHON")
          "$python_interpreter" -m tools.test_bindings python dist/*.whl
          "$python_interpreter" -m tools.test_bindings node \
            "dist/mikrio-node-$release_version.tgz" --native dist/mikrio-node-*-"$release_version".tgz

      - name: Verify clean working tree
        run: |
          working_tree_status=$(git status --porcelain)
          test -z "$working_tree_status"

  sources:
    name: Build and test source distributions
    needs: dependencies
    if: inputs.release
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python

      - name: Set up Rust
        run: rustup show

      - name: Install Python dependencies
        run: uv sync --project packages/python --locked --group build --no-install-project --no-build

      - name: Build and test source distributions
        run: uv run --project packages/python --no-sync python -m tools.build_release sources

      - name: Verify clean working tree
        run: |
          working_tree_status=$(git status --porcelain)
          test -z "$working_tree_status"

      - name: Upload source distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sources
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  assemble:
    name: Assemble and verify release
    needs: [dependencies, lint, rust, sdk, native, runtimes, sources]
    if: inputs.release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read release version
        id: version
        run: echo "version=$(python3 -m tools.version show)" >> "$GITHUB_OUTPUT"

      - name: Download native distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: incoming
          digest-mismatch: error

      - name: Download source distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sources
          path: incoming/sources
          digest-mismatch: error

      - name: Assemble and verify release
        run: python3 -m tools.release assemble release --input incoming

      - name: Upload release distributions
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.version.outputs.version }}
          path: release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Write release summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "Release $RELEASE_VERSION passed package assembly and consumer checks."
            echo
            echo "[Download the tested archives, release manifest and checksums]($ARTIFACT_URL)."
          } >> "$GITHUB_STEP_SUMMARY"

  gate:
    name: Checks passed
    needs: [dependencies, lint, rust, sdk, native, runtimes, sources, assemble]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected check to pass
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
          CHECK_EVENT: ${{ github.event_name }}
          CHECK_RELEASE: ${{ inputs.release || false }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results = json.loads(os.environ["CHECK_RESULTS"])
          required = {"dependencies"}

          if os.environ["CHECK_EVENT"] != "schedule":
              required.update({"lint", "rust", "sdk", "native"})

          if os.environ["CHECK_RELEASE"] == "true":
              required.update({"runtimes", "sources", "assemble"})

          failed = sorted(name for name in required if results[name]["result"] != "success")

          if failed:
              raise SystemExit("Required checks did not pass: " + ", ".join(failed))
          PY
